    <script>
      (function() {
        if (typeof window !== 'undefined' && window.location.origin) {
          const absoluteImg = window.location.origin + '/assets/aistudio/tagline_by_logo_2cf77e5f.png';
          const ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg) ogImg.setAttribute('content', absoluteImg);

          if (ogSecImg) ogSecImg.setAttribute('content', absoluteImg);
          const twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg) twImg.setAttribute('content', absoluteImg);
        }
      })();
